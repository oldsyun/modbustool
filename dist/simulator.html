<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模拟器 · Modbus Tool</title>
    <script type="module" crossorigin src="./assets/simulator-DmUjxHQj.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/window-Ci8KILSs.js">
    <link rel="stylesheet" crossorigin href="./assets/window-x7NlT7Rg.css">
  </head>
  <body class="sim-win">
    <!-- ══════════════ 窗口工具栏 ══════════════ -->
    <header id="simWinBar">
      <span class="brand">⚙ 模拟器</span>
      <div class="sim-spacer"></div>
      <button class="tb-btn small" id="simWinClose">关闭</button>
    </header>

    <!-- ══════════════ 视图：寄存器设置 ══════════════ -->
    <section id="simRegView" class="sim-view">
      <div class="sim-pane">
        <!-- 运行模式面板（启动 / 停止各通道模拟） -->
        <div class="sim-reg-toolbar">
          <div class="sim-reg-toolbar-left">
            <div id="simUnitChips" class="sim-tabs"></div>
            <input id="simUnitInput" class="sim-unit-input" type="number" min="1" max="247" placeholder="Unit ID" />
            <button class="tb-btn small" id="simUnitAddBtn">+ Unit</button>
            <button class="tb-btn small" id="simUnitDelBtn">− Unit</button>
            <div class="toolbar-sep"></div>
            <button class="tb-btn small" id="btnSimConnSettings">⚙ 通道设置</button>
            <div class="toolbar-sep"></div>
            <div id="simModePanel" class="sim-mode-panel-inline"></div>
          </div>
          <div class="sim-reg-toolbar-right">
            <button class="tb-btn small" id="simRegImportBtn">📂 导入 Excel</button>
            <button class="tb-btn small" id="simRegExportBtn">💾 导出 Excel</button>
            <div class="toolbar-sep"></div>
            <button class="tb-btn small" id="simRegSeed">恢复示例</button>
            <button class="tb-btn small" id="simReset">清零数据</button>
          </div>
        </div>

        <!-- 区域 tab 条 + 新增按钒 -->
        <div class="sim-area-bar">
          <div id="simAreaTabs" class="live-data-tabs">
            <button class="live-tab active" data-area="holding">保持寄存器 <small id="simCntHolding"></small></button>
            <button class="live-tab" data-area="input">输入寄存器 <small id="simCntInput"></small></button>
            <button class="live-tab" data-area="coil">线圈 <small id="simCntCoil"></small></button>
            <button class="live-tab" data-area="discrete">离散输入 <small id="simCntDiscrete"></small></button>
          </div>
          <span id="simRegCount" class="sim-reg-count"></span>
          <div class="sim-spacer"></div>
          <button class="tb-btn small primary" id="simRegAddBtn">+ 新增寄存器</button>
        </div>

        <!-- 寄存器表格 -->
        <div class="sim-table-wrap">
          <table class="sim-table">
            <thead>
              <tr>
                <th class="sim-addr">地址</th>
                <th>名称</th>
                <th>类型</th>
                <th>访问</th>
                <th>变化</th>
                <th>值</th>
                <th class="sim-hex">HEX</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="simRegTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ══════════════ 寄存器新增 / 编辑 dialog ══════════════ -->
    <dialog id="simRegDialog" class="modal sim-modal">
      <div class="modal-header">
        <strong id="simRegFormTitle">新增寄存器</strong>
        <button class="modal-close" id="simRegFormClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="reg-add-form">
          <div class="reg-fld">
            <span class="reg-lbl">区域</span>
            <select id="srArea">
              <option value="holding" selected>保持寄存器</option>
              <option value="input">输入寄存器</option>
              <option value="coil">线圈</option>
              <option value="discrete">离散输入</option>
            </select>
          </div>
          <div class="reg-fld reg-fld-addr">
            <span class="reg-lbl">起始地址</span>
            <input id="srAddr" type="number" min="0" max="65535" value="0" />
          </div>
          <div class="reg-fld reg-fld-bit" id="srBitWrap" style="display: none;">
            <span class="reg-lbl">位序号</span>
            <select id="srBit">
              <option value="0" selected>0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
            </select>
          </div>
          <div class="reg-fld reg-fld-count">
            <span class="reg-lbl">数量</span>
            <input id="srCount" type="number" min="1" max="200" value="1" title="次数、连续地址自动递增" />
          </div>
          <div class="reg-fld reg-fld-name">
            <span class="reg-lbl">名称/前缀</span>
            <input id="srName" type="text" placeholder="单个名称或批量前缀" />
          </div>
          <div class="reg-fld">
            <span class="reg-lbl">数据类型</span>
            <select id="srDtype">
              <option value="u16" selected>U16</option>
              <option value="i16">I16</option>
              <option value="u32">U32</option>
              <option value="i32">I32</option>
              <option value="f32">F32</option>
              <option value="bits">位图/位数组</option>
            </select>
          </div>
          <div class="reg-fld">
            <span class="reg-lbl">访问</span>
            <select id="srAccess">
              <option value="rw" selected>读写</option>
              <option value="ro">只读</option>
            </select>
          </div>
          <div class="reg-row" id="srValVaryRow">
            <div class="reg-fld" id="srVaryWrap">
              <span class="reg-lbl">自动变化</span>
              <select id="srVary">
                <option value="off" selected>关闭</option>
                <option value="sine">正弦</option>
                <option value="random">随机</option>
                <option value="increment">自增</option>
              </select>
            </div>
            <div class="reg-fld reg-fld-val" id="srValWrap">
              <span class="reg-lbl">初始值</span>
              <span id="srValControl"><input id="srValue" type="number" value="0" /></span>
            </div>
          </div>
          <div class="reg-add-error" id="simRegFormError"></div>
        </div>
        <div class="sim-pane-note" id="srVaryHint">每个寄存器可独立设置自动变化；多字类型按单字原始值存储。</div>
      </div>
      <div class="modal-footer">
        <button class="tb-btn" id="simRegFormCancel">取消</button>
        <button class="tb-btn primary" id="simRegFormSave">保存</button>
      </div>
    </dialog>

    <!-- 重复地址「替换」确认 -->
    <dialog id="simReplaceDialog" class="modal">
      <div class="modal-header">
        <strong>地址已存在</strong>
        <button class="modal-close" id="simReplaceClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="alert-msg" id="simReplaceMsg"></div>
      </div>
      <div class="modal-footer">
        <button class="tb-btn" id="simReplaceCancel">取消</button>
        <button class="tb-btn primary" id="simReplaceOk">替换</button>
      </div>
    </dialog>

    <!-- 删除确认 -->
    <dialog id="simDelDialog" class="modal">
      <div class="modal-header">
        <strong>删除寄存器</strong>
        <button class="modal-close" id="simDelClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="alert-msg" id="simDelMsg"></div>
      </div>
      <div class="modal-footer">
        <button class="tb-btn" id="simDelCancel">取消</button>
        <button class="tb-btn danger" id="simDelOk">删除</button>
      </div>
    </dialog>

    <!-- ══════════════ 模拟器通道设置 Dialog (modal) ══════════════ -->
    <dialog id="simConnDialog" class="modal conn-modal">
      <div class="modal-header">
        <strong>通道设置 (Channel Settings)</strong>
        <button class="modal-close" id="simConnClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="sim-section-label">运行模式</div>
        <div class="sim-mode-radios">
          <label class="radio-item active" data-simmode="tcp">
            <input type="radio" name="simMode" value="tcp" checked />
            <span class="radio-dot"></span>
            <span>Modbus TCP</span>
          </label>
          <label class="radio-item" data-simmode="udp">
            <input type="radio" name="simMode" value="udp" />
            <span class="radio-dot"></span>
            <span>Modbus UDP</span>
          </label>
          <label class="radio-item" data-simmode="rtu_tcp">
            <input type="radio" name="simMode" value="rtu_tcp" />
            <span class="radio-dot"></span>
            <span>RTU over TCP</span>
          </label>
          <label class="radio-item" data-simmode="rtu_udp">
            <input type="radio" name="simMode" value="rtu_udp" />
            <span class="radio-dot"></span>
            <span>RTU over UDP</span>
          </label>
          <label class="radio-item" data-simmode="rtu">
            <input type="radio" name="simMode" value="rtu" />
            <span class="radio-dot"></span>
            <span>RTU（串口）</span>
          </label>
        </div>

        <!-- 网络模式：tcp / udp / rtu_tcp / rtu_udp 共用 绑定地址 + 端口 -->
        <div class="sim-fields" data-sim-for="tcp udp rtu_tcp rtu_udp">
          <label class="form-row">
            <span class="form-label">绑定地址</span>
            <input id="simBind" value="0.0.0.0" placeholder="0.0.0.0" />
          </label>
          <label class="form-row">
            <span class="form-label">端口</span>
            <input id="simPort" type="number" value="502" min="1" max="65535" />
          </label>
        </div>

        <!-- RTU 串口配置 -->
        <div class="sim-fields hidden" data-sim-for="rtu">
          <label class="form-row">
            <span class="form-label">串口</span>
            <div class="form-row-right">
              <select id="simRtuPortName"><option value="">加载中...</option></select>
              <button class="tb-btn small" id="simBtnRefreshPorts" title="刷新串口列表">↻</button>
            </div>
          </label>
          <label class="form-row">
            <span class="form-label">波特率</span>
            <div class="form-row-right">
              <select id="simRtuBaud">
                <option value="9600" selected>9600</option>
                <option value="19200">19200</option>
                <option value="38400">38400</option>
                <option value="57600">57600</option>
                <option value="115200">115200</option>
              </select>
            </div>
          </label>
          <label class="form-row">
            <span class="form-label">数据位</span>
            <div class="form-row-right">
              <select id="simRtuDataBits">
                <option value="8" selected>8</option>
                <option value="7">7</option>
              </select>
            </div>
          </label>
          <label class="form-row">
            <span class="form-label">停止位</span>
            <div class="form-row-right">
              <select id="simRtuStopBits">
                <option value="1" selected>1</option>
                <option value="2">2</option>
              </select>
            </div>
          </label>
          <label class="form-row">
            <span class="form-label">校验</span>
            <div class="form-row-right">
              <select id="simRtuParity">
                <option value="none" selected>None</option>
                <option value="even">Even</option>
                <option value="odd">Odd</option>
              </select>
            </div>
          </label>
          <label class="form-row">
            <span class="form-label">帧间(ms)</span>
            <input id="simRtuInter" type="number" placeholder="默认 5（≈9600 波特 3.5 字符）" />
          </label>
        </div>

        <div id="simModeHint" class="sim-pane-note" style="margin-top: 10px;"></div>
      </div>
      <div class="modal-footer">
        <span id="simModeStatus" class="sim-status" style="margin-right: auto; align-self: center;">未连接</span>
        <button class="tb-btn" id="simConnCancel">取消</button>
        <button class="tb-btn primary" id="simConnect">⇄ 连接通道</button>
      </div>
    </dialog>

  </body>
</html>
