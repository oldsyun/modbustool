name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-gpui"

      - name: Build native app
        # GPUI's pinned gpui-pre uses an unstable std feature; RUSTC_BOOTSTRAP=1
        # enables it on stable. The vendored gpui-pre-macos patch is applied via
        # [patch.crates-io] in the workspace Cargo.toml.
        env:
          RUSTC_BOOTSTRAP: "1"
          CARGO_TARGET_DIR: target-gpui
        run: cargo build -p modbus-tool-gpui --release

      - name: Package binary
        run: |
          mkdir -p dist
          cp target-gpui/release/modbus-tool dist/modbus-tool-macos-aarch64
          tar -czf dist/modbus-tool-macos-aarch64.tar.gz -C dist modbus-tool-macos-aarch64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Modbus Tool v${{ github.ref_name }}
          draft: true
          files: dist/modbus-tool-macos-aarch64.tar.gz
