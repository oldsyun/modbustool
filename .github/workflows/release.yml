name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-gpui"

      - name: Build native app
        # GPUI's pinned gpui-pre uses an unstable std feature; RUSTC_BOOTSTRAP=1
        # enables it on stable. The vendored gpui-pre-macos patch is applied via
        # [patch.crates-io] in the workspace Cargo.toml.
        env:
          RUSTC_BOOTSTRAP: "1"
          CARGO_TARGET_DIR: target-gpui
        run: cargo build -p modbus-tool-gpui --release

      - name: Package macOS app (.app + zip)
        env:
          RUSTC_BOOTSTRAP: "1"
          CARGO_TARGET_DIR: target-gpui
        run: |
          ./scripts/package-macos.sh
          # If hdiutil/diskutil can create a DMG on the runner, include it;
          # otherwise ship the zipped .app (always produced).
          ls -lh dist/

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Modbus Tool v${{ github.ref_name }}
          draft: true
          files: |
            dist/ModbusTool-*-macos.zip
            dist/ModbusTool-*-macos.dmg
